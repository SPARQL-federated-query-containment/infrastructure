# Runs as the login user (no become) so the SSH agent forwarded from your laptop
# authenticates the git@github.com clone of benchmark-runner and its submodules
# (solver via HTTPS, then solver/specs/SpeCS and solver/qcan/QCan via SSH -- QCan
# is unused by the benchmark but --recursive pulls it; both are public).
# Make sure `ssh-add <your-github-key>` was run locally before the playbook.
- name: Clone benchmark-runner with submodules
  ansible.builtin.git:
    repo: "{{ benchmark_repo }}"
    dest: "{{ benchmark_dest }}"
    version: "{{ benchmark_version }}"
    recursive: true
    accept_hostkey: true
    update: true
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new"
